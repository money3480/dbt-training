models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains airbnb listings
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1
          severity: warn
    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']

      - name: minimum_nights
        description: "{{ doc('dim_listing_cleansed_minimum_nights') }}"
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        columns:
            - include: '*'
              exclude: [host_name]
            - name: host_name
              description: The name of the host (N/A if not available)
              data_type: string
              constraints:
                - type: not_null
        defined_in: dim_hosts_cleansed_v2
    latest_version: 2
    description: Cleansed table which contains airbnb hosts
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [host_id]
    columns:
      - name: host_id
        description: Primary key for the host.  Referenced in dim_hosts_cleansed as a foreign key.
        data_type: integer
        constraints:
          - type: not_null
          - type: unique

      - name: host_name
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: "{{ doc('dim_hosts_cleansed_is_superhost') }}"
        data_type: string
        data_tests:
         - accepted_values:
             arguments:
               values: ['t',
                        'f']
      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp

  - name: dim_listings_w_host
    tests:
    - dbt_expectations.expect_table_row_count_to_equal_other_table:
        compare_model: source('airbnb','listings')
    columns:
      - name: price_usd
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99
              min_value: 50 # (Optional)
              max_value: 8000 # (Optional)
          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 8000 # (Optional)
              config:
                severity: warn
  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']